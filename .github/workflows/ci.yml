name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      # Two configs: the Worker source is checked without node types so it
      # cannot reach for an API workerd has no implementation of, and the
      # tests are checked with them. See tsconfig.test.json.
      - name: Typecheck
        run: npm run typecheck
